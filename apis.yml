aid: adaption-labs
name: Adaption Labs
description: >-
  Adaption Labs is a San Francisco AI research company, founded in 2025 by Sara
  Hooker and Sudip Roy (both formerly of Cohere), building adaptive AI systems
  that continuously learn from real-world interaction instead of scaling through
  ever-larger pretraining runs. Its Adaptive Data platform and the REST Adaption
  API let teams ingest, adapt, evaluate, and export model-ready training data,
  while AutoScientist automates the research loop behind model training and
  alignment. The Adaption API is available through a web app and an official
  Python SDK (pip install adaption). Backed by a $50M seed round led by Emergence
  Capital, with Threshold Ventures, Mozilla Ventures, Fifty Years, and others.
